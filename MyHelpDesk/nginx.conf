map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # MapLibre loads its module worker from a .mjs asset. Browsers require a
    # JavaScript MIME type; Nginx otherwise serves it as application/octet-stream.
    location ~* ^/assets/.*\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    # REST API: keep the /api/... path unchanged for ASP.NET Core routing.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR hubs: support both negotiate requests and upgraded WebSockets.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA (react-router): rute yang tidak ada file-nya diarahkan ke index.html
    location / {
        try_files $uri /index.html;
    }
}
