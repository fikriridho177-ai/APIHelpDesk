services:
  web:
    build:
      context: .
      args:
        # Ditanam saat build; ubah ke alamat API yang bisa diakses browser.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5100/api}
        VITE_IOT_API_URL: ${VITE_IOT_API_URL:-http://localhost:5100/api}
    image: myhelpdesk
    container_name: myhelpdesk-web
    restart: unless-stopped
    ports:
      - "8080:80"
