services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: apihelpdesk-api:local
    env_file:
      - ${API_ENV_FILE:-.env}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
    expose:
      - "8080"
    restart: unless-stopped

  web:
    build:
      context: ${MYHELPDESK_CONTEXT:-../MyHelpDesk}
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_IOT_API_URL: ${VITE_IOT_API_URL:-/api}
    image: myhelpdesk:local
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
