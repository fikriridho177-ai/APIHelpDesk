services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: apihelpdesk-api:local
    env_file:
      - ${API_ENV_FILE:-.env}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      IoT__Firmware__StoragePath: ${IOT_FIRMWARE_STORAGE_PATH:-/app/firmware}
      IoT__Firmware__MaxBytes: ${IOT_FIRMWARE_MAX_BYTES:-52428800}
    expose:
      - "8080"
    volumes:
      - api_firmware:/app/firmware
    restart: unless-stopped

  web:
    build:
      context: ${MYHELPDESK_CONTEXT:-../MyHelpDesk}
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_IOT_API_URL: ${VITE_IOT_API_URL:-/api}
        VITE_WAD_DEVICE_MANAGEMENT_MODE: ${VITE_WAD_DEVICE_MANAGEMENT_MODE:-api}
    image: myhelpdesk:local
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-api:8080}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  api_firmware:
