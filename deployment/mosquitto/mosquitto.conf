# Mosquitto broker untuk HelpDesk-ASD WAD
# ------------------------------------------------------------
# 1883 = MQTT TCP untuk ESP32/ESP8266
# 9001 = MQTT over WebSocket untuk browser (mqtt.js)
#
# Jalankan:
#   docker run -d --name helpdesk-mosquitto \
#     -p 1883:1883 -p 9001:9001 \
#     -v "$PWD/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
#     -v "$PWD/acl:/mosquitto/config/acl:ro" \
#     -v "$PWD/passwd:/mosquitto/config/passwd:ro" \
#     eclipse-mosquitto:2
#
# Buat passwd sekali (DataLogger untuk firmware, WebViewer baca-saja untuk web):
#   docker run --rm -it -v "$PWD:/work" eclipse-mosquitto:2 sh -c \
#     "mosquitto_passwd -c -b /work/passwd DataLogger 'GANTI-PASSWORD' && \
#      mosquitto_passwd -b /work/passwd WebViewer 'GANTI-PASSWORD-WEB'"
#
# Di belakang HTTPS, proxy /mqtt -> host:9001 dan set
# VITE_MQTT_WS_URL=wss://<domain>/mqtt saat build frontend.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Payload telemetry/OTA kecil; batas ini mencegah publish liar.
message_size_limit 65536

# Retained status dan LWT tetap tersimpan agar halaman web langsung
# mengetahui kondisi perangkat setelah dibuka.
retain_available true

# Koneksi dari perangkat di lapangan dapat putus sementara.
max_keepalive 300
